name: KOREA

on:
  schedule:
    - cron: "*/10 * * * *"  # Runs every 10 minutes
  workflow_dispatch:        # Allows manual trigger

permissions:
  contents: write           # Grants permission to push commits to the repo

jobs:
  update_m3u8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.x"

      - name: Install requests
        run: pip install requests

      - name: Run update.py
        run: python update.py || echo "Python script failed, but workflow continues"

      - name: Commit & Push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git
          git add korea.m3u8 korea2.m3u8
          git diff --staged --quiet || (git commit -m "Auto update korea.m3u8" && git push)
